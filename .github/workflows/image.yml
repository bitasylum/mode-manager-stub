name: Image

# Builds the stub image for amd64 and arm64 and pushes it to GHCR:
# every push to main as `main` and `sha-<commit>`, and every v<semver> tag on
# main as its version, for example `0.1.0` and `0.1`. Images from main are
# development builds. There is no `latest`: the chart pins its version.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

# One build per ref at a time, so an older build can't overwrite `main` after
# a newer one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # A manual run only rebuilds main, so it can't push another branch's
    # code under a version tag.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      # For the signed build provenance.
      id-token: write
      attestations: write
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe needs the tags, for the version stamped into the
          # binary, and the release check needs main.
          fetch-depth: 0

      - name: Check that a release tag is on main
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }

      - name: Work out the version
        id: version
        run: |
          version=$(git describe --tags --always)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # `main` only from the default branch, and `sha-` only from branch
      # builds, so a tag build of the same commit doesn't replace it.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The builder stage runs on the runner's platform and cross-compiles, so
      # arm64 needs no emulation. Release builds don't use the build cache, so
      # nothing a branch build cached can end up in a release.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          no-cache: ${{ github.ref_type == 'tag' }}
          cache-from: ${{ github.ref_type == 'branch' && 'type=gha' || '' }}
          cache-to: ${{ github.ref_type == 'branch' && 'type=gha,mode=max' || '' }}

      # Signed provenance in the registry, which `gh attestation verify
      # oci://ghcr.io/<repo>:<tag> --repo <repo>` checks.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
